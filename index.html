<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Happy Mother's Day ❤️</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.js"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      background: #fffafb;
      font-family: 'Quicksand', sans-serif;
      scroll-behavior: smooth;
    }

    .font-serif {
      font-family: 'Playfair Display', serif;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #fff1f2;
    }

    ::-webkit-scrollbar-thumb {
      background: #fda4af;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #fb7185;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { motion, AnimatePresence } = Motion;

const PHOTOS = [
  {
    id: 1,
    url: "https://images.unsplash.com/photo-1516627145497-ae6968895b74?q=80&w=800&auto=format&fit=crop",
    caption: "My safest place ❤️"
  },
  {
    id: 2,
    url: "https://images.unsplash.com/photo-1515488764276-beab7607c1e6?q=80&w=800&auto=format&fit=crop",
    caption: "Your smile is my sunshine ✨"
  },
  {
    id: 3,
    url: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=800&auto=format&fit=crop",
    caption: "Forever my home 💖"
  },
  {
    id: 4,
    url: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=800&auto=format&fit=crop",
    caption: "Best memories together 🌸"
  },
  {
    id: 5,
    url: "https://images.unsplash.com/photo-1501333190100-ad94c3c97ea0?q=80&w=800&auto=format&fit=crop",
    caption: "Love you forever Maa 💕"
  },
  {
    id: 6,
    url: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=800&auto=format&fit=crop",
    caption: "My biggest blessing ✨"
  }
];

function FloatingHeart({ delay }) {
  return (
    <motion.div
      initial={{ y: "100vh", opacity: 0 }}
      animate={{
        y: "-10vh",
        opacity: [0, 0.6, 0],
        x: [0, 20, -20, 0]
      }}
      transition={{
        duration: 10,
        repeat: Infinity,
        delay,
        ease: "linear"
      }}
      className="fixed text-pink-300/40 z-0 pointer-events-none"
      style={{ left: `${Math.random() * 100}%` }}
    >
      ❤️
    </motion.div>
  );
}

function App() {

  const [selectedPhoto, setSelectedPhoto] = React.useState(null);

  return (
    <div className="min-h-screen bg-gradient-to-br from-rose-50 via-pink-50 to-orange-50 relative overflow-hidden">

      {[...Array(15)].map((_, i) => (
        <FloatingHeart key={i} delay={i * 0.8} />
      ))}

      {/* HERO */}
      <section className="h-screen flex flex-col items-center justify-center text-center px-6 relative">

        <motion.div
          initial={{ opacity: 0, y: 40 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 1 }}
        >

          <div className="text-5xl mb-6">
            ✨
          </div>

          <h1 className="text-5xl md:text-8xl font-bold text-rose-800 leading-tight font-serif">
            Happy Mother's Day
            <br />
            <span className="text-rose-500 italic">
              Maa ❤️
            </span>
          </h1>

          <p className="mt-8 text-xl md:text-3xl text-rose-700/80 italic max-w-3xl mx-auto font-serif">
            "You are the heart of our home and the reason behind every smile."
          </p>

          <button
            onClick={() => {
              document.getElementById("gallery").scrollIntoView({
                behavior: "smooth"
              });
            }}
            className="mt-12 bg-rose-500 hover:bg-rose-600 text-white px-10 py-5 rounded-full text-xl font-bold shadow-2xl transition-all"
          >
            For You Maa 💌
          </button>

        </motion.div>

      </section>

      {/* GALLERY */}
      <section
        id="gallery"
        className="py-24 px-6 max-w-7xl mx-auto"
      >

        <div className="text-center mb-20">

          <div className="text-5xl mb-5">
            📸
          </div>

          <h2 className="text-5xl font-bold text-rose-800 font-serif">
            Beautiful Memories
          </h2>

          <div className="w-28 h-1 bg-rose-200 mx-auto rounded-full mt-5"></div>

        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">

          {PHOTOS.map((photo, index) => (

            <motion.div
              key={photo.id}
              initial={{ opacity: 0, y: 40 }}
              whileInView={{ opacity: 1, y: 0 }}
              transition={{
                duration: 0.7,
                delay: index * 0.1
              }}
              viewport={{ once: true }}
              onClick={() => setSelectedPhoto(photo)}
              className="cursor-pointer group"
            >

              <div className="bg-white p-4 rounded-[2rem] shadow-xl hover:-translate-y-3 transition-all duration-500">

                <div className="overflow-hidden rounded-[1.5rem] aspect-[4/5]">

                  <img
                    src={photo.url}
                    alt=""
                    className="w-full h-full object-cover group-hover:scale-110 transition-all duration-700"
                  />

                </div>

                <p className="text-center mt-5 text-rose-700 italic font-semibold text-lg font-serif">
                  {photo.caption}
                </p>

              </div>

            </motion.div>

          ))}

        </div>

      </section>

      {/* MESSAGE */}
      <section className="py-24 px-6">

        <motion.div
          initial={{ opacity: 0, scale: 0.9 }}
          whileInView={{ opacity: 1, scale: 1 }}
          viewport={{ once: true }}
          className="max-w-5xl mx-auto bg-white/70 backdrop-blur-xl rounded-[4rem] p-12 md:p-20 shadow-2xl border border-white"
        >

          <div className="text-center">

            <div className="text-6xl mb-8">
              ❤️
            </div>

            <h2 className="text-4xl md:text-6xl text-rose-800 font-bold font-serif italic mb-12">
              To The Best Mother In The World ❤️
            </h2>

            <div className="space-y-8 text-xl md:text-2xl text-rose-900/80 leading-relaxed italic font-serif">

              <p>
                Maa, thank you for being the biggest blessing of my life.
                Your love, care, sacrifices and support mean everything to me.
              </p>

              <p>
                No matter how old I become, I will always need your love,
                your smile and your warmth.
              </p>

              <p>
                You are my first home, my first teacher and my forever safe place.
              </p>

              <p>
                I love you more than words can ever explain ❤️
              </p>

            </div>

          </div>

        </motion.div>

      </section>

      {/* FINAL */}
      <section className="py-40 text-center relative">

        <motion.div
          animate={{
            scale: [1, 1.1, 1]
          }}
          transition={{
            repeat: Infinity,
            duration: 2
          }}
          className="text-8xl mb-8"
        >
          ❤️
        </motion.div>

        <h2 className="text-5xl md:text-8xl text-rose-800 font-bold font-serif">
          I LOVE YOU MAA ❤️
        </h2>

        <p className="mt-8 text-rose-500 text-2xl italic font-serif">
          Home is wherever you are.
        </p>

      </section>

      {/* FOOTER */}
      <footer className="py-12 text-center border-t border-rose-100 bg-white/50">

        <p className="text-rose-400 italic text-xl font-serif">
          Made with endless love for Maa ❤️
        </p>

      </footer>

      {/* LIGHTBOX */}
      <AnimatePresence>

        {selectedPhoto && (

          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            onClick={() => setSelectedPhoto(null)}
            className="fixed inset-0 bg-black/70 backdrop-blur-xl z-50 flex items-center justify-center p-6"
          >

            <motion.div
              initial={{ scale: 0.8 }}
              animate={{ scale: 1 }}
              exit={{ scale: 0.8 }}
              onClick={(e) => e.stopPropagation()}
              className="bg-white p-6 rounded-[3rem] max-w-xl w-full text-center relative"
            >

              <button
                onClick={() => setSelectedPhoto(null)}
                className="absolute top-5 right-5 bg-rose-100 hover:bg-rose-200 w-12 h-12 rounded-full text-rose-500 text-xl"
              >
                ✕
              </button>

              <div className="overflow-hidden rounded-[2rem] aspect-[4/5]">

                <img
                  src={selectedPhoto.url}
                  className="w-full h-full object-cover"
                />

              </div>

              <h3 className="mt-6 text-3xl text-rose-800 font-serif italic">
                {selectedPhoto.caption}
              </h3>

            </motion.div>

          </motion.div>

        )}

      </AnimatePresence>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
